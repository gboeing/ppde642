---
name: CI

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash -elo pipefail {0}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: true

      - name: Install environment
        run: uv sync --locked

      - name: Test environment
        run: |
          uv pip check
          uv run --no-sync python -c "import osmnx, pandarm, rasterio"
          uv run --no-sync python -c "import torch; from transformers import pipeline"

      - name: Cache pre-commit
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek/
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint
        run: uv run --no-sync prek run --all-files
        env:
          PREK_HOME: ~/.cache/prek
          SKIP: no-commit-to-branch
