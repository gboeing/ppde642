[project]
authors = [{ name = "Geoff Boeing", email = "boeing@usc.edu" }]
name = "PPDE642"
version = "2027"
description = "USC PPDE642: Advanced Urban Analytics"
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "contextily",
    "folium",
    "osmnx[all]",
    "pandarm",
    "pysal",
    "seaborn[stats]",
    "torch",
    "transformers",
]

[dependency-groups]
dev = ["jupyterlab", "nbdime", "prek"]

[tool.ruff]
cache-dir = "~/.cache/prek/cache/ruff"
line-length = 100

[tool.ruff.lint]
extend-select = ["A", "B", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.pycodestyle]
max-line-length = 110 # line length + 10% since it isn't a hard upper bound

# Use CPU builds on Linux and Windows to avoid unnecessary CUDA dependencies.
# macOS uses the standard PyPI builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
